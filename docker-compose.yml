version: "3.9"

services:
  weft:
    build: .
    ports:
      - "8765:8765"
    environment:
      - WEFT_KNOWN_SCOPES=default,benchmark
      - WEFT_DB_PATH=/home/weft/.weft/weft.sqlite3
      - WEFT_API_KEY=${WEFT_API_KEY:?set WEFT_API_KEY}
    volumes:
      - weft-data:/home/weft/.weft
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8765/health', headers={'Authorization': 'Bearer ' + __import__('os').environ.get('WEFT_API_KEY', '')}))\""]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  weft-data:
