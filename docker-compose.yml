services:
  aletheia:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      - ALETHEIA_KNOWN_SCOPES=default,benchmark
      - ALETHEIA_DB_PATH=/home/aletheia/.aletheia/aletheia.sqlite3
      - ALETHEIA_API_KEY=${ALETHEIA_API_KEY:?set ALETHEIA_API_KEY}
    volumes:
      - aletheia-data:/home/aletheia/.aletheia
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8765/health', headers={'Authorization': 'Bearer ' + __import__('os').environ.get('ALETHEIA_API_KEY', '')}))\""]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  aletheia-data:
