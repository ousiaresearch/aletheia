version: "3.9"

services:
  weft:
    build: .
    ports:
      - "8765:8765"
    environment:
      - WEFT_API_KEY=changeme
      - WEFT_KNOWN_SCOPES=default,benchmark
      - WEFT_DB_PATH=/home/weft/.weft/weft.sqlite3
    volumes:
      - weft-data:/home/weft/.weft
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  weft-data:
