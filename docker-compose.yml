version: "3.9"

services:
  weft:
    build: .
    ports:
      - "8765:8765"
    environment:
      - WEFT_KNOWN_SCOPES=default,benchmark
      - WEFT_DB_PATH=/home/weft/.weft/weft.sqlite3
      - WEFT_API_KEY=${WEFT_API_KEY:?set WEFT_API_KEY}
    volumes:
      - weft-data:/home/weft/.weft
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer ${WEFT_API_KEY}' http://localhost:8765/health | grep -q '^200$'"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  weft-data:
