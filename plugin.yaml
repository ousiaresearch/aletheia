name: aletheia
label: Aletheia
version: 2.0.0
kind: standalone
author: Ousia Research
homepage: https://github.com/ousiaresearch/aletheia
description: >-
  Aletheia — evidence-bound scoped memory for Hermes agents: turns are written to a local SQLite
  store inside the active profile, recall is scoped before it is ranked, and every recall returns a
  receipt naming the scope consulted and the ids selected. This repository is both the substrate and
  the plugin: the manifest below registers the provider, and the package it depends on ships here.
requires_hermes: ">=0.22.5"
python_dependencies:
  # The distribution name is not yet on PyPI under our control (both `aletheia` and
  # `aletheia-memory` belong to other people), so the dependency is this repository at a tag.
  # Replace with the published name the moment one is reserved.
  - "aletheia @ git+https://github.com/ousiaresearch/aletheia@v2.0.0"
  - "sentence-transformers>=3.0,<6"
  - "mlx-embeddings==0.1.0; sys_platform == 'darwin' and platform_machine == 'arm64'"
config_keys:
  - memory.aletheia
