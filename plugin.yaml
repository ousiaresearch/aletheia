name: aletheia
label: Aletheia
version: 2.1.0
kind: standalone
author: Ousia Research
homepage: https://github.com/ousiaresearch/aletheia
description: >-
  Aletheia — evidence-bound scoped memory for Hermes agents: turns are written to a local SQLite
  store inside the active profile, recall is scoped before it is ranked, and every recall returns a
  receipt naming the scope consulted and the ids selected. This repository is both the substrate and
  the plugin: the manifest below registers the provider, and the package it depends on ships here.
requires_hermes: ">=0.22.5"
python_dependencies:
  # The provider's runtime requirements, mirroring pyproject where they are actually declared.
  #
  # A mirror, because it is not what Hermes installs: PM reads a plugin's authored pyproject.toml
  # first and uses this list only when none ships. Both therefore have to name these three pins,
  # with these markers, and tests/test_runtime_deps.py fails when they disagree.
  #
  # `ousia-aletheia` is listed for manifest-only readers; when this repository is installed as a
  # workspace member the local pyproject supplies the package, so that pin is not consulted.
  # (`aletheia` and `aletheia-memory` belong to other people on PyPI; the import name is still
  # `aletheia`.)
  - "ousia-aletheia>=2,<3"
  - "sentence-transformers>=3.0,<6; sys_platform == 'darwin' and platform_machine == 'arm64'"
  - "mlx>=0.32.4,<0.33; sys_platform == 'darwin' and platform_machine == 'arm64'"
  - "mlx-embeddings==0.1.0; sys_platform == 'darwin' and platform_machine == 'arm64'"
config_keys:
  - memory.aletheia
