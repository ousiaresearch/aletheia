name: weft
label: Weft
version: 0.1.0a1
kind: standalone
author: Ousia Research
homepage: https://github.com/ousiaresearch/weft
description: >-
  Evidence-bound scoped memory: turns are ingested into a local SQLite substrate, recall is scoped
  first and ranked second, and every answer carries a receipt. The substrate ships in the weft-memory
  package; this manifest only registers the memory provider.
requires_hermes: ">=0.22.5"
python_dependencies:
  - "weft-memory>=0.1.0a1,<0.2"
  - "sentence-transformers>=2.0,<6"
  - "mlx-embeddings==0.1.0; sys_platform == 'darwin' and platform_machine == 'arm64'"
config_keys:
  - memory.weft
